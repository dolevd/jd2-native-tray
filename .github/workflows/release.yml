name: Release from main

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (for example v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark as a prerelease
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-from-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require main and a new version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release.sh --validate
  build:
    needs: validate
    uses: ./.github/workflows/build-shared.yml
    with:
      ref: ${{ github.sha }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release-assets
      - name: Publish the tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: bash scripts/ci/release.sh release-assets
